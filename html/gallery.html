<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Gallery | Isaac Macinas</title>
	<link rel="icon" type="image/x-icon" href = "../favicon.ico">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=PT+Serif&display=swap" rel="stylesheet">
</head>

<body>
	<header>
		<div class="logobanner">
			<img src="../images/mainlogo.png" id="mainlogo">
			<h1>Isaac Macinas</h1>
		</div>
		<div class="navbar">
			<a href="../index.html">HOME</a>
			<a href="about.html">ABOUT</a>
			<a href="#top-page">GALLERY</a>
			<a href="contact.html">CONTACT</a>
		</div>
	</header>
	
	<main>
		<div id="top-page" class="herobanner herogallery">
			<h1>My Works</h1>
		</div>

		<div class="gallerydark">
			<h1>Gallery</h1>
			<div class="navbar centernav">
				<a class="jump-button" href="#graphic-designs">Graphic Designs</a>
				<a class="jump-button" href="#certificates">Certificates</a>
				<a class="jump-button" href="#videos">Videos</a>
			</div>
		</div>

		<div id="graphic-designs" class="text-banner no-bg">
			<h1>Graphic Designs</h1>
		</div>

		<div class="galleryarea">

			<div class="gallerylist">
				<div class="gallerycard">
					<img id="PUZZLED" src="../images/PUZZLEEED.png" alt="Puzzled">
				</div>
				<div class="gallerycard">
					<img id="Porsche" src="../images/Porchse (1).png" alt="Porsche">
				</div>
				<div class="gallerycard">
					<img id="coffeezip" src="../images/coffee.zip moodboard.png" alt="">
				</div>
				<div class="gallerycard">
					<img id="global" src="../images/Globalisasyon.png" alt="">
				</div>
				<div class="gallerycard">
					<img id="APPoster" src="../images/apposter.jpg" alt="Poster">
				</div>
			</div>
		</div>

	<div id="certificates" class="text-banner no-bg">
		<h1>Certificates</h1>
	</div>

	<div class="galleryarea">
		<div class="gallerylist">
			<div class="gallerycard">
				<img id="certificate-img" src="../images/sqlcertificate.jpeg" alt="SQL Certificate">
			</div>
			<div class="gallerycard">
				<img id="certificate-img" src="../images/simplilearn.jpg" alt="SimpliLearn Certificate">
			</div>
		</div>
	</div>

	<div id="videos" class="text-banner no-bg">
		<h1>Video Edits + Song Covers</h1>
	</div>

	<div class="galleryarea">
		<div class="gallerylist">
			<div class="gallerycard">
				<video id="CCC" controls poster="../images/whatshappening.png" src="../images/Plvs Ccc Vlog.mp4"></video>
			</div>
			<div class="gallerycard">
				<video controls poster="../images/plvsingers.png" src="../images/Plvsorgshirt Revised.mp4"></video>
			</div>
			<div class="gallerycard">
				<video controls poster="../images/panayam.png" src="../images/Group 1 Vts 2025.mp4"></video>
			</div>
			<div class="gallerycard">
				<video controls poster="../images/nanaman.png" src="../images/NANAMAN - IV OF SPADES Guitar Solo Cover.mp4"></video>
			</div>
		</div>
	</div>

	</main>

	<footer>
		<div class="logobanner">
			<img src="../images/mainlogo-light.png" id="mainlogo">
			
			<div class="credits">
				<p>Designed and Developed by Isaac Derek N. Macinas from BSIT 2-4</p>
			</div>
		</div>
		<div class="credits">
			<p>© Copyright 2026</p>
		</div>
	</footer>
</body>

</html>
